name: Static analysis
on: pull_request

permissions:
  contents: read

jobs:
  static-psalm-analysis:
      runs-on: ubuntu-latest
      strategy:
          matrix:
              ocp-version:
                  - 'dev-master'
                  - 'dev-stable35'
                  - 'dev-stable34'
                  - 'dev-stable33'
                  - 'dev-stable32'
      name: Nextcloud ${{ matrix.ocp-version }}
      steps:
          - name: Checkout
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
          - name: Set up php
            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
                php-version: 8.3
                coverage: none
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          - name: Install dependencies
            run: composer i
          - name: Install OCP package
            run: composer require --dev nextcloud/ocp:${{ matrix.ocp-version }} --ignore-platform-reqs -W
          - name: Run coding standards check
            run: composer run psalm

  summary:
    runs-on: ubuntu-latest
    needs:
      - static-psalm-analysis
    if: always()
    name: static-analysis-summary
    steps:
      - name: Static analysis status
        run: if ${{ needs.static-psalm-analysis.result != 'success' && needs.static-psalm-analysis.result != 'skipped' }}; then exit 1; fi
